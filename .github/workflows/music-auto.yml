name: Music Auto Downloader

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ffmpeg jq curl lftp python3 python3-pip wget gnupg
          pip3 install -U yt-dlp


      - name: Install Cloudflare WARP
        run: |

          curl https://pkg.cloudflareclient.com/pubkey.gpg \
          | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg

          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" \
          | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          sudo apt update
          sudo apt install -y cloudflare-warp


      - name: Connect WARP
        run: |

          sudo warp-cli --accept-tos registration new || true
          sudo warp-cli --accept-tos mode warp
          sudo warp-cli --accept-tos connect || true

          sleep 8

          warp-cli status || true


      - name: Download music
        run: |

          mkdir -p downloads

          while IFS= read -r ARTIST || [ -n "$ARTIST" ]; do

            echo "======================="
            echo "Artist: $ARTIST"
            echo "======================="

            SAFE_ARTIST=$(echo "$ARTIST" | sed 's#[/:*?"<>|]##g')

            mkdir -p "downloads/$SAFE_ARTIST"

            QUERY="${ARTIST} official audio"

            yt-dlp \
              "ytsearch2:${QUERY}" \
              --extract-audio \
              --audio-format mp3 \
              --embed-thumbnail \
              --add-metadata \
              --restrict-filenames \
              --no-playlist \
              --ignore-errors \
              --geo-bypass \
              -o "downloads/$SAFE_ARTIST/%(title).100s.%(ext)s"

          done < artists.txt


      - name: Upload to FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |

          echo "Uploading to FTP..."

          lftp -e "
          set ssl:verify-certificate no
          open ftp://$FTP_USER:$FTP_PASS@$FTP_HOST
          mirror -R downloads $FTP_DIR
          bye
          "


      - name: Done
        run: echo "✅ Finished downloading and uploading music"
