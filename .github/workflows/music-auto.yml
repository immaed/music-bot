name: Music Auto Downloader

on:
  workflow_dispatch:

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - uses: actions/checkout@v4


      - name: Install packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            python3-pip \
            lftp \
            curl \
            gnupg \
            ca-certificates \
            nodejs \
            npm

          pip3 install -U yt-dlp

          node -v
          yt-dlp --version


      - name: Install WARP
        run: |

          curl https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor \
            -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg

          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          sudo apt-get update
          sudo apt-get install -y cloudflare-warp


      - name: Connect WARP
        run: |

          sudo warp-cli --accept-tos registration new || true

          sudo warp-cli --accept-tos mode warp

          timeout 20 sudo warp-cli --accept-tos connect || true

          sleep 10

          warp-cli status || true

          curl https://www.cloudflare.com/cdn-cgi/trace || true


      - name: Download music
        run: |

          mkdir -p upload

          yt-dlp \
            "https://youtu.be/E3QiD99jPAg" \
            --force-ipv4 \
            --extract-audio \
            --audio-format mp3 \
            --audio-quality 0 \
            --embed-thumbnail \
            --add-metadata \
            --js-runtimes node \
            --extractor-args "youtube:player_client=android,mweb" \
            --retries 10 \
            --fragment-retries 10 \
            -o "upload/%(title).100s.%(ext)s"

          echo "FILES:"
          find upload || true


      - name: Upload FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |

          lftp -d -e "
          set ssl:verify-certificate no;
          set ftp:passive-mode on;
          open ftp://$FTP_USER:$FTP_PASS@$FTP_HOST;
          mkdir -p $FTP_DIR;
          mirror -R upload $FTP_DIR;
          bye;
          "
