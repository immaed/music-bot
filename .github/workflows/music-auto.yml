name: Music Auto Downloader

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt update

          sudo apt install -y \
            ffmpeg \
            jq \
            curl \
            lftp \
            python3

          pip install yt-dlp

      - name: Download music
        run: |

          mkdir -p downloads

          while IFS= read -r ARTIST || [ -n "$ARTIST" ]; do

            echo "================================="
            echo "Artist: $ARTIST"
            echo "================================="

            SAFE_ARTIST=$(echo "$ARTIST" | sed 's#[/:*?"<>|]##g')

            mkdir -p "downloads/$SAFE_ARTIST"

            SEARCH_QUERY="${ARTIST} official audio"

            yt-dlp \
              "ytsearch3:${SEARCH_QUERY}" \
              --match-filter "duration < 900" \
              --extract-audio \
              --audio-format mp3 \
              --embed-thumbnail \
              --add-metadata \
              --write-thumbnail \
              --convert-thumbnails jpg \
              --output "downloads/$SAFE_ARTIST/%(title)s.%(ext)s" \
              --no-playlist \
              --ignore-errors \
              --no-overwrites

          done < artists.txt

      - name: Upload to FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |

          lftp -e "
          set ssl:verify-certificate no

          open ftp://$FTP_USER:$FTP_PASS@$FTP_HOST

          mirror -R downloads $FTP_DIR

          bye
          "

      - name: Finished
        run: |
          echo "✅ Upload completed"
