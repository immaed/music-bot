name: Music Auto Downloader

on:
  workflow_dispatch:

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip lftp
          pip3 install -U yt-dlp


      - name: Download music
        run: |
          mkdir -p upload

          yt-dlp "ytsearch1:the weeknd official audio" \
            --extract-audio \
            --audio-format mp3 \
            --audio-quality 0 \
            --add-metadata \
            --embed-thumbnail \
            --retries 5 \
            --fragment-retries 5 \
            --extractor-args "youtube:player_client=android,web,mweb" \
            -o "upload/%(title).100s.%(ext)s"

          echo "Files:"
          find upload


      - name: Upload FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |

          lftp -d -e "
          set ssl:verify-certificate no;
          set ftp:passive-mode on;
          open ftp://$FTP_USER:$FTP_PASS@$FTP_HOST;
          mkdir -p $FTP_DIR;
          mirror -R upload $FTP_DIR;
          bye;
          "
