name: Music Auto Downloader

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            ffmpeg \
            jq \
            curl \
            lftp \
            python3 \
            python3-pip \
            wget \
            gnupg

          pip3 install --upgrade yt-dlp

      - name: Install Cloudflare WARP
        run: |

          curl https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg

          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          sudo apt update
          sudo apt install -y cloudflare-warp

      - name: Connect WARP
        run: |

          sudo warp-cli registration new
          sudo warp-cli mode warp
          sudo warp-cli connect

          sleep 10

          warp-cli status

      - name: Download music
        run: |

          mkdir -p downloads

          while IFS= read -r ARTIST || [ -n "$ARTIST" ]; do

            echo "=============================="
            echo "Downloading for: $ARTIST"
            echo "=============================="

            SAFE_ARTIST=$(echo "$ARTIST" | sed 's#[/:*?"<>|]##g')

            mkdir -p "downloads/$SAFE_ARTIST"

            SEARCH_QUERY="${ARTIST} official audio"

            yt-dlp \
              "ytsearch2:${SEARCH_QUERY}" \
              --extract-audio \
              --audio-format mp3 \
              --embed-thumbnail \
              --write-thumbnail \
              --convert-thumbnails jpg \
              --add-metadata \
              --restrict-filenames \
              --no-playlist \
              --ignore-errors \
              --geo-bypass \
              --output "downloads/$SAFE_ARTIST/%(title).100s.%(ext)s"

          done < artists.txt

      - name: Upload to FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |

          echo "Uploading files to FTP..."

          lftp -e "
          set ssl:verify-certificate no
          open ftp://$FTP_USER:$FTP_PASS@$FTP_HOST
          mirror -R downloads $FTP_DIR
          bye
          "

      - name: Done
        run: echo "✅ Music download and upload finished"
